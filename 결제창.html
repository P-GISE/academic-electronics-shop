<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑몰 결제창</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    a {
    text-decoration: none;
    color:darkblue;
}
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }

    .checkout-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    label {
      margin-top: 10px;
    }

    textarea, input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    button {
      background-color: #4caf50;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .purchase-message {
      display: none;
      text-align: center;
      background-color: #4CAF50;
      color: #fff;
      padding: 20px;
      border-radius: 5px;
      margin-top: 20px;
    }

    .purchase-message button {
      background-color: #fff;
      color: #4CAF50;
      border: 1px solid #4CAF50;
      padding: 10px;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="checkout-container">
    <h2>주문 상세 정보</h2>
    <form id="checkoutForm">
      <label for="shippingAddress">배송지 주소:</label>
      <textarea id="shippingAddress" required></textarea>

      <label for="quantity">수량:</label>
      <input type="number" id="quantity" min="1" max="9" value="1" required>

      <label for="paymentMethod">결제 수단:</label>
      <select id="paymentMethod" required>
        <option value="creditCard">신용카드</option>
        <option value="debitCard">직불카드</option>
        <option value="bankTransfer">계좌이체</option>
      </select>

      <button type="button" onclick="processPayment()">결제하기</button>
    </form>

    <!-- 결제 완료 메시지 -->
    <div id="purchaseCompleteMessage" class="purchase-message">
      <p>결제가 완료되었습니다!</p>
      <button onclick="redirectToMain()">확인</button>
    </div>
  </div>

  <script>
    function processPayment() {
      // 입력된 정보 가져오기
      const shippingAddress = document.getElementById('shippingAddress').value;
      const quantity = document.getElementById('quantity').value;
      const paymentMethod = document.getElementById('paymentMethod').value;

      // 여기에서 서버로 결제 정보 전송하는 로직을 추가해야 합니다.

      // 결제 완료 메시지 표시
      displayPurchaseMessage();
    }

    function displayPurchaseMessage() {
      const purchaseMessage = document.getElementById('purchaseCompleteMessage');
      purchaseMessage.style.display = 'block';
    }

    function redirectToMain() {
      // 여기에서 실제 메인 페이지로의 이동 로직을 추가합니다.
      // 예를 들어, 현재는 경고창을 띄우는 예시를 제공합니다.
      alert('메인 페이지로 이동합니다.');
      window.location.href = '카테고리.html';
    }
  </script>
</body>
</html>
