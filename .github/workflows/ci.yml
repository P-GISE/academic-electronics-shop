name: Static deployment checks
on:
  pull_request:
  push:
    branches: [main, codex/deployment-prep-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HTTP_PORT: "18085"
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate static references and demo boundaries
        run: python scripts/check_static.py
      - name: Build and start static image
        run: |
          docker compose -f compose.production.yaml build --build-arg REVISION_SHA="$GITHUB_SHA"
          docker compose -f compose.production.yaml up -d --wait
      - name: Check root, Korean assets and public boundaries
        run: python scripts/check_static.py --base-url http://127.0.0.1:18085
      - name: Container logs
        if: always()
        run: docker compose -f compose.production.yaml logs --no-color
      - name: Clean up synthetic runtime
        if: always()
        run: docker compose -f compose.production.yaml down
      - name: Package verified immutable image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(docker image inspect academic-electronics-shop:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker tag academic-electronics-shop:ci academic-electronics-shop:$GITHUB_SHA
          mkdir -p release
          docker save academic-electronics-shop:$GITHUB_SHA | gzip > release/image.tar.gz
          (cd release && sha256sum image.tar.gz > image.sha256)
          echo "$GITHUB_SHA" > release/revision.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: five-sites-app-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
