name: Static deployment checks
on:
  pull_request:
  push:
    branches: [main, codex/deployment-prep-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  static-image:
    needs: ["security"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HTTP_PORT: "18085"
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify event deployment workflow regressions
        run: python -m unittest discover -s scripts/deploy -p test_event_workflow.py -v
      - name: Verify runtime security gate regressions
        run: python -m unittest discover -s scripts/security -p test_image_gate.py -v
      - name: Validate static references and demo boundaries
        run: python scripts/check_static.py
      - name: Build and start static image
        run: |
          docker compose -f compose.production.yaml build --build-arg REVISION_SHA="$GITHUB_SHA"
          docker compose -f compose.production.yaml up -d --wait
      - name: Gate the actual built runtime image OS packages
        run: |
          image_id=$(docker image inspect academic-electronics-shop:ci --format '{{.Id}}')
          bash scripts/security/scan-image.sh "$image_id"
      - name: Check root, Korean assets and public boundaries
        run: python scripts/check_static.py --base-url http://127.0.0.1:18085
      - name: Clean up synthetic runtime
        if: always()
        run: docker compose -f compose.production.yaml down
      - name: Package verified immutable image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(docker image inspect academic-electronics-shop:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker tag academic-electronics-shop:ci academic-electronics-shop:$GITHUB_SHA
          mkdir -p release
          docker save academic-electronics-shop:$GITHUB_SHA | gzip > release/image.tar.gz
          (cd release && sha256sum image.tar.gz > image.sha256)
          echo "$GITHUB_SHA" > release/revision.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'push'
        with:
          name: five-sites-app-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
