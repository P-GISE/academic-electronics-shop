<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그아웃 창</title>
</head>
<body>

<!-- 로그아웃 버튼을 클릭하면 logout 함수 호출 -->
<button onclick="logout()">로그아웃</button>

<script>
  // 로그아웃 함수 정의
  function logout() {
    // 여기에서 실제로 로그아웃하는 동작을 수행할 수 있습니다.
    // 예를 들면, 세션을 종료하거나 로그인 정보를 삭제하는 등의 동작을 수행할 수 있습니다.
    alert("로그아웃 되었습니다.");  // 예제에서는 간단히 경고창을 띄우도록 합니다.
  }
</script>

</body>
</html>
