name: academic-electronics-shop
services:
  web:
    build: .
    image: academic-electronics-shop:${IMAGE_TAG:?Set IMAGE_TAG to the reviewed commit}
    ports:
      - "127.0.0.1:${HTTP_PORT:?Set a free loopback HTTP_PORT}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
