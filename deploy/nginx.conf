server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index 메인.html;
    charset utf-8;
    server_tokens off;
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://use.fontawesome.com; font-src 'self' https://use.fontawesome.com; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
